# Publishes a signed provider release to the Terraform Registry when a v* tag
# is pushed. The tag-push triggers a set of gate jobs (offline verification,
# dependency hygiene, and a live-tenant acceptance run); goreleaser publishes
# only after all gates pass, so a bad tag cannot reach the public registry.
#
# GoReleaser signs with the GPG key in the TERRAFORM_REGISTRY_GPG_PRIVATE_KEY /
# TERRAFORM_REGISTRY_PASSPHRASE secrets and uploads the archives, checksums,
# signature, and registry manifest to the GitHub Release; the Terraform
# Registry ingests that release through its webhook.
name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  GOWORK: 'off'

jobs:
  verify:
    name: Offline verification
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Release tag must be on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          main_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          git fetch --no-tags origin "$main_sha"
          if ! git merge-base --is-ancestor "$GITHUB_SHA" "$main_sha"; then
            echo "Release tag commit $GITHUB_SHA is not an ancestor of main ($main_sha); release only from main." >&2
            exit 1
          fi
      - name: Release tag must be described in the changelog
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if ! awk -v prefix="## [$GITHUB_REF_NAME] - " 'index($0, prefix) == 1 { found = 1 } END { exit !found }' CHANGELOG.md; then
            echo "CHANGELOG.md has no release heading for $GITHUB_REF_NAME; move the release notes out of Unreleased before tagging." >&2
            exit 1
          fi
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: '1.15.9'
          terraform_wrapper: false
      - name: Select Terraform CLI
        run: echo "TF_ACC_TERRAFORM_PATH=$(command -v terraform)" >> "$GITHUB_ENV"
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test (race)
        run: go test -race ./... -count=1
      - name: Examples are valid HCL
        # Each example directory is a standalone root module. The provider
        # under test is served through dev_overrides so validation does not
        # depend on a published registry release.
        run: |
          set -euo pipefail
          terraform fmt -check -recursive examples vars
          go build -o "$RUNNER_TEMP/tfp/terraform-provider-tss" .
          cat > "$RUNNER_TEMP/tfp/cli.tfrc" <<EOF
          provider_installation {
            dev_overrides {
              "DelineaXPM/tss" = "$RUNNER_TEMP/tfp"
            }
            direct {}
          }
          EOF
          export TF_CLI_CONFIG_FILE="$RUNNER_TEMP/tfp/cli.tfrc"
          for dir in examples/secrets/*/; do
            echo "validating $dir"
            (cd "$dir" && terraform validate -no-color)
          done
      - name: Tidy drift
        run: |
          go mod tidy
          (cd tools && go mod tidy)
          git diff --exit-code -- go.mod go.sum tools/go.mod tools/go.sum
      - name: Registry manifest is present
        run: |
          set -euo pipefail
          jq -e '.version == 1 and (.metadata.protocol_versions | index("6.0") != null)' terraform-registry-manifest.json >/dev/null

  dependency:
    name: Dependency hygiene
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Refuse module replace directives
        run: |
          set -euo pipefail
          for module in . tools; do
            replacements=$(cd "$module" && go mod edit -json | jq '.Replace | length')
            if [ "$replacements" != 0 ]; then
              echo "Refusing release with active module replace directives in $module/go.mod:" >&2
              (cd "$module" && go mod edit -json | jq '.Replace' >&2)
              exit 1
            fi
          done
      - name: govulncheck
        run: |
          (cd tools && go install golang.org/x/vuln/cmd/govulncheck)
          "$(go env GOPATH)/bin/govulncheck" ./...

  acceptance:
    name: Live acceptance gate
    needs: verify
    uses: ./.github/workflows/acceptance-suite.yml
    with:
      terraform_version: '1.15.9'
      # A release must exercise every acceptance cell, including the SSH-key
      # and mixed-template tests that skip when their template ids are unset.
      require_all_tests: true
    secrets: inherit

  goreleaser:
    name: Publish signed release
    needs: [verify, dependency, acceptance]
    environment: release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      -
        name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      -
        name: Unshallow
        run: git fetch --prune --unshallow
      -
        name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      -
        name: Import GPG key
        id: import_gpg
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # v7.0.0
        with:
          gpg_private_key: ${{ secrets.TERRAFORM_REGISTRY_GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.TERRAFORM_REGISTRY_PASSPHRASE }}
      -
        name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: v2.18.0
          args: release --clean
        env:
          GPG_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}
          # GitHub sets this automatically
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
